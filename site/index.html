<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta id="meta-desc" name="description" content="NeuroDynamics is a nonprofit health-tech research and development initiative at the School of Engineering of the Federal University of Minas Gerais (UFMG). Software, firmware, embedded systems and AI in service of human health.">
<meta name="theme-color" content="#050807">
<title>NeuroDynamics — Nonprofit Health-Tech R&D</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050807; --panel:#0B1210; --ink:#F5F5F7; --muted:#9AA5A1; --dim:#616C68;
  --line:rgba(245,245,247,.08); --line2:rgba(245,245,247,.16);
  --deep:#00352F; --green:#00594F; --green2:#0B7D6E; --teal:#2DD4BF; --syn:#CEDC00;
  --card:rgba(255,255,255,.03); --glass:rgba(7,12,10,.62);
  --r:18px; --max:1240px;
  --fd:'Archivo',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
h1,h2,h3,h4{font-family:var(--fd);letter-spacing:-.015em}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
img{max-width:100%}
[hidden]{display:none!important}
::selection{background:var(--syn);color:var(--deep)}

/* ============ BACKGROUND ============ */
#bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
  radial-gradient(120% 90% at 72% -12%, #081511 0%, var(--bg) 58%)}
#bg::after{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(245,245,247,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(245,245,247,.028) 1px,transparent 1px);
  background-size:130px 130px;
  -webkit-mask-image:radial-gradient(85% 62% at 50% 26%, #000 0%, transparent 100%);
          mask-image:radial-gradient(85% 62% at 50% 26%, #000 0%, transparent 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(120px);will-change:transform;opacity:.32}
.b1{width:56vmax;height:56vmax;left:-18vmax;top:-24vmax;
  background:radial-gradient(circle,#00594F 0%,rgba(0,89,79,0) 70%);
  animation:fl1 38s ease-in-out infinite alternate}
.b2{width:42vmax;height:42vmax;right:-16vmax;top:8vmax;opacity:.2;
  background:radial-gradient(circle,#0B7D6E 0%,rgba(11,125,110,0) 70%);
  animation:fl2 32s ease-in-out infinite alternate}
.b3{width:30vmax;height:30vmax;left:36vw;bottom:-18vmax;opacity:.06;
  background:radial-gradient(circle,#CEDC00 0%,rgba(206,220,0,0) 70%);
  animation:fl3 44s ease-in-out infinite alternate}
@keyframes fl1{from{transform:translate(0,0) scale(1)}to{transform:translate(8vw,6vh) scale(1.14)}}
@keyframes fl2{from{transform:translate(0,0) scale(1.08)}to{transform:translate(-10vw,10vh) scale(.94)}}
@keyframes fl3{from{transform:translate(0,0) scale(1)}to{transform:translate(-7vw,-12vh) scale(1.2)}}
@media (prefers-reduced-motion:reduce){
  .blob,.mq-track,.wave path{animation:none!important}
  *{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}
}

/* ============ FLOATING HEADER ============ */
#hd{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;
  width:min(var(--max),calc(100vw - 28px));
  border:1px solid var(--line);border-radius:16px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);
  transition:border-color .3s, box-shadow .3s, background .3s}
#hd.rolou{border-color:var(--line2);box-shadow:0 18px 50px rgba(0,0,0,.45);background:rgba(7,12,10,.8)}
.hd-in{display:flex;align-items:center;gap:20px;padding:0 8px 0 20px;height:58px}
.hd-logo{display:flex;align-items:center;flex-shrink:0;margin-right:auto}
.hd-logo img{height:19px;width:auto;display:block;filter:brightness(0) invert(1)}
.logotype{font-family:var(--fd);font-weight:700;font-size:17.5px;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
nav.hd-nav{display:flex;gap:2px}
nav.hd-nav a{font-family:var(--fd);font-size:13px;font-weight:500;color:var(--muted);
  padding:8px 14px;border-radius:10px;transition:color .15s,background .15s;white-space:nowrap}
nav.hd-nav a:hover{color:var(--ink);background:rgba(255,255,255,.05)}
nav.hd-nav a.on{color:var(--ink)}
nav.hd-nav a.on::after{content:'';display:block;height:1.5px;margin:1px 2px 0;background:var(--syn)}
.hd-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hd-cta{display:inline-flex;align-items:center;height:42px;padding:0 20px;border-radius:11px;
  background:var(--ink);color:#0A0F0E;font-family:var(--fd);font-weight:600;font-size:13.5px;
  white-space:nowrap;transition:transform .15s, box-shadow .15s}
.hd-cta:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(245,245,247,.15)}
.hd-burger{width:42px;height:42px;border:1px solid var(--line2);border-radius:11px;
  display:inline-flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;
  transition:border-color .15s, background .15s}
.hd-burger:hover{border-color:var(--dim);background:rgba(255,255,255,.04)}
.hd-burger i{display:block;width:16px;height:1.5px;background:var(--ink);transition:transform .25s,opacity .25s}
body.menu-open .hd-burger i:nth-child(1){transform:translateY(3.25px) rotate(45deg)}
body.menu-open .hd-burger i:nth-child(2){transform:translateY(-3.25px) rotate(-45deg)}

/* language selector */
.lang{display:flex;align-items:center;height:42px;padding:3px;gap:1px;
  border:1px solid var(--line2);border-radius:11px;background:rgba(255,255,255,.03)}
.lang button{font-family:var(--fm);font-size:11px;letter-spacing:.06em;color:var(--dim);
  height:100%;padding:0 9px;border-radius:8px;transition:color .15s,background .15s}
.lang button:hover{color:var(--muted)}
.lang button.on{color:var(--ink);background:rgba(255,255,255,.09)}
@media (max-width:920px){
  nav.hd-nav{display:none}
  .hd-in{height:54px;gap:12px}
  .hd-cta{height:40px;padding:0 16px}
  .hd-burger,.lang{height:40px}
  .hd-burger{width:40px}
}
@media (max-width:560px){
  .hd-cta{display:none}
  .hd-in{padding-left:16px}
  .lang button{padding:0 8px}
}

/* ============ FULLSCREEN MENU ============ */
#menu{position:fixed;inset:0;z-index:55;background:rgba(4,7,6,.72);
  backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);
  opacity:0;pointer-events:none;transition:opacity .3s ease}
body.menu-open #menu{opacity:1;pointer-events:auto}
.menu-in{max-width:var(--max);margin:0 auto;padding:130px 26px 40px;height:100%;
  display:flex;flex-direction:column}
.menu-links{display:flex;flex-direction:column}
.menu-links a{display:flex;align-items:baseline;gap:22px;padding:16px 4px;
  border-top:1px solid var(--line);font-family:var(--fd);font-weight:600;
  font-size:clamp(30px,5.5vw,54px);letter-spacing:-.02em;color:var(--muted);
  transform:translateY(18px);opacity:0;transition:color .2s}
.menu-links a:last-child{border-bottom:1px solid var(--line)}
body.menu-open .menu-links a{animation:mrise .55s cubic-bezier(.22,1,.36,1) forwards}
body.menu-open .menu-links a:nth-child(2){animation-delay:.06s}
body.menu-open .menu-links a:nth-child(3){animation-delay:.12s}
body.menu-open .menu-links a:nth-child(4){animation-delay:.18s}
@keyframes mrise{to{transform:none;opacity:1}}
.menu-links a:hover,.menu-links a.on{color:var(--ink)}
.menu-links a .idx{font-family:var(--fm);font-size:12px;font-weight:400;color:var(--dim);letter-spacing:.1em}
.menu-links a:hover .idx{color:var(--syn)}
.menu-foot{margin-top:auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  font-family:var(--fm);font-size:11.5px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.menu-foot a:hover{color:var(--ink)}

/* ============ LAYOUT PRIMITIVES ============ */
main{max-width:var(--max);margin:0 auto;padding:0 26px}
section{margin:0 0 clamp(90px,12vh,150px)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--fm);font-size:11px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.eyebrow::before{content:'';width:7px;height:7px;background:var(--syn);flex-shrink:0}
.sec-head{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:start;margin-bottom:48px}
.sec-head h2{font-size:clamp(28px,4vw,46px);font-weight:600;line-height:1.08;max-width:640px}
.sec-head .sub{color:var(--muted);max-width:560px;margin-top:14px;font-size:15.5px}
@media (max-width:820px){.sec-head{grid-template-columns:1fr;gap:14px}}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.reveal.viu{opacity:1;transform:none}
.pg-head{padding-top:170px;margin-bottom:clamp(60px,9vh,110px)}
.pg-head h1{font-size:clamp(38px,6.4vw,74px);font-weight:600;line-height:1.04;letter-spacing:-.025em;
  max-width:900px;margin:20px 0 22px}
.pg-head .lead{font-size:clamp(15.5px,1.7vw,18px);color:var(--muted);max-width:640px}

/* ============ HERO ============ */
#hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;
  padding:150px 0 34px;position:relative}
#hero h1{font-size:clamp(42px,7.2vw,96px);font-weight:600;letter-spacing:-.03em;line-height:.99;
  margin:22px 0 26px;max-width:1000px}
.hero-sub{font-size:clamp(15.5px,1.75vw,19px);color:var(--muted);max-width:620px;margin-bottom:38px}
.hero-sub b{color:var(--ink);font-weight:600}
.hero-acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-radius:12px;
  font-family:var(--fd);font-weight:600;font-size:14px;white-space:nowrap;
  transition:transform .15s, box-shadow .15s, background .15s, border-color .15s}
.btn.solid{background:var(--ink);color:#0A0F0E}
.btn.solid:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(245,245,247,.14)}
.btn.ghost{border:1px solid var(--line2);color:var(--ink);background:rgba(255,255,255,.03)}
.btn.ghost:hover{background:rgba(255,255,255,.07);border-color:var(--dim)}
.btn .ar{width:15px;height:15px}
.hero-meta{margin-top:auto;padding-top:56px;display:flex;justify-content:space-between;gap:14px;
  flex-wrap:wrap;border-top:1px solid var(--line)}
.hero-meta span{font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.hero-meta span em{font-style:normal;color:var(--muted)}
.wave{position:absolute;right:-6vw;top:16%;width:56vw;max-width:820px;opacity:.5;pointer-events:none;z-index:-1}
.wave path{fill:none;stroke:rgba(206,220,0,.16);stroke-width:1.4;
  stroke-dasharray:6 7;animation:dashmove 26s linear infinite}
.wave path.p2{stroke:rgba(45,212,191,.12);animation-duration:34s;animation-direction:reverse}
@keyframes dashmove{to{stroke-dashoffset:-260}}
@media (max-width:820px){.wave{display:none}}

/* ============ STATEMENT ============ */
.statement{display:grid;grid-template-columns:220px 1fr;gap:26px}
@media (max-width:820px){.statement{grid-template-columns:1fr;gap:14px}}
.statement .big{font-family:var(--fd);font-size:clamp(21px,2.9vw,32px);font-weight:500;
  line-height:1.42;letter-spacing:-.012em;max-width:880px}
.statement .big b{font-weight:600;color:var(--ink)}
.statement .big .soft{color:var(--dim)}
.statement .after{color:var(--muted);max-width:640px;margin-top:26px;font-size:15.5px}

/* ============ EXPERTISE INDEX ============ */
.xlist{border-bottom:1px solid var(--line)}
.xrow{display:grid;grid-template-columns:90px 1.1fr 1.5fr 40px;gap:26px;align-items:baseline;
  padding:30px 6px;border-top:1px solid var(--line);position:relative;transition:background .2s}
.xrow:hover{background:linear-gradient(90deg,rgba(255,255,255,.025),transparent 70%)}
.xrow .no{font-family:var(--fm);font-size:12px;color:var(--dim);letter-spacing:.1em}
.xrow:hover .no{color:var(--syn)}
.xrow h3{font-size:clamp(18px,2vw,23px);font-weight:600;letter-spacing:-.01em}
.xrow p{font-size:14px;color:var(--muted);max-width:560px}
.xrow .tick{justify-self:end;align-self:center;width:22px;height:22px;color:var(--dim);
  opacity:0;transform:translateX(-8px);transition:opacity .2s,transform .2s}
.xrow:hover .tick{opacity:1;transform:none;color:var(--ink)}
@media (max-width:820px){
  .xrow{grid-template-columns:52px 1fr;gap:8px 16px;padding:24px 2px}
  .xrow h3{grid-column:2}
  .xrow p{grid-column:2}
  .xrow .tick{display:none}
}

/* ============ PROJECT CARDS (home preview) ============ */
.pgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.pcard{grid-column:span 6;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:var(--card);backdrop-filter:blur(6px);display:flex;flex-direction:column;
  transition:transform .25s cubic-bezier(.22,1,.36,1), border-color .25s}
.pcard:hover{transform:translateY(-5px);border-color:var(--line2)}
.pcard.w7{grid-column:span 7}.pcard.w5{grid-column:span 5}
.pcard .ph{border:none;border-bottom:1px solid var(--line);border-radius:0}
.pcard .body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:8px;flex:1}
.pcard .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.pcard h3{font-size:21px;font-weight:600}
.pcard .st{font-family:var(--fm);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line2);border-radius:3px;padding:3px 8px;white-space:nowrap}
.pcard .tg{font-size:13.5px;color:var(--muted);line-height:1.55}
.pcard .go{margin-top:auto;padding-top:10px;font-family:var(--fm);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);display:inline-flex;align-items:center;gap:8px;transition:color .15s}
.pcard:hover .go{color:var(--syn)}
@media (max-width:860px){.pcard,.pcard.w7,.pcard.w5{grid-column:span 12}}
.pgrid-foot{display:flex;justify-content:flex-end;margin-top:26px}

/* ============ IMAGE PLACEHOLDER ============ */
.ph{position:relative;aspect-ratio:16/9;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:radial-gradient(120% 130% at 18% -10%,rgba(0,89,79,.28),transparent 58%),var(--panel)}
.ph.tall{aspect-ratio:4/3}
.ph::before{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(245,245,247,.03) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(245,245,247,.03) 1px,transparent 1px);
  background-size:44px 44px}
.ph .glyph{position:absolute;right:-4%;bottom:-22%;font-family:var(--fd);font-weight:700;
  font-size:min(46cqw,240px);line-height:1;color:rgba(245,245,247,.045);user-select:none;letter-spacing:-.04em}
.ph .fig{position:absolute;left:14px;bottom:12px;font-family:var(--fm);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.ph .fig em{font-style:normal;color:var(--muted)}
.ph .crop{position:absolute;width:14px;height:14px;color:rgba(245,245,247,.25)}
.ph .crop.tl{top:10px;left:10px;border-top:1px solid;border-left:1px solid}
.ph .crop.tr{top:10px;right:10px;border-top:1px solid;border-right:1px solid}
.ph .crop.bl{bottom:10px;left:10px;border-bottom:1px solid;border-left:1px solid}
.ph .crop.br{bottom:10px;right:10px;border-bottom:1px solid;border-right:1px solid}
.ph img.real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{container-type:inline-size}

/* ============ PARTNERS MARQUEE ============ */
.mq-wrap{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:38px 0}
.mq{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.mq-track{display:flex;align-items:center;gap:0;width:max-content;animation:mq 42s linear infinite}
.mq:hover .mq-track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mq-item{display:flex;align-items:center;gap:14px;padding:0 44px;flex-shrink:0;
  opacity:.5;filter:grayscale(1);transition:opacity .2s}
.mq-item:hover{opacity:.95}
.mq-item img{height:34px;width:auto}
.mq-item .tm{font-family:var(--fd);font-weight:700;font-size:24px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.mq-item .tm small{display:block;font-family:var(--fm);font-weight:400;font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:2px}

/* ============ ABOUT ============ */
.how-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (max-width:820px){.how-grid{grid-template-columns:1fr}}
.how{border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  backdrop-filter:blur(6px);padding:28px 26px;transition:border-color .2s}
.how:hover{border-color:var(--line2)}
.how .no{font-family:var(--fm);font-size:11px;letter-spacing:.14em;color:var(--dim);margin-bottom:18px;display:block}
.how h3{font-size:19px;font-weight:600;margin-bottom:9px}
.how p{font-size:14px;color:var(--muted)}
.quiet{border-left:2px solid var(--syn);padding:6px 0 6px 26px;max-width:760px}
.quiet p{font-size:clamp(16px,1.9vw,19px);line-height:1.7;color:var(--ink)}
.quiet p + p{margin-top:14px}
.quiet .fine{font-size:14px;color:var(--muted)}
.chan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:820px){.chan-grid{grid-template-columns:1fr}}
.chan{border:1px solid var(--line);border-radius:var(--r);padding:26px 24px;background:var(--card);
  display:flex;flex-direction:column;gap:8px;transition:border-color .2s,transform .2s}
a.chan:hover{border-color:var(--line2);transform:translateY(-3px)}
.chan .lb{font-family:var(--fm);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.chan .vl{font-family:var(--fd);font-size:17px;font-weight:600;word-break:break-word}
.chan p{font-size:13px;color:var(--muted)}
.chan .go{margin-top:auto;padding-top:8px;font-family:var(--fm);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim)}
a.chan:hover .go{color:var(--syn)}

/* ============ NONPROFIT LEDGER ============ */
.ledger{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;background:var(--card)}
@media (max-width:820px){.ledger{grid-template-columns:1fr}}
.ledger .cell{padding:30px 28px;border-right:1px solid var(--line)}
.ledger .cell:last-child{border-right:none}
@media (max-width:820px){
  .ledger .cell{border-right:none;border-bottom:1px solid var(--line)}
  .ledger .cell:last-child{border-bottom:none}
}
.ledger .k{font-family:var(--fm);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);display:block;margin-bottom:14px}
.ledger .v{font-family:var(--fd);font-size:clamp(19px,2.3vw,25px);font-weight:600;
  line-height:1.2;letter-spacing:-.015em;margin-bottom:10px}
.ledger .v em{font-style:normal;color:var(--syn)}
.ledger p{font-size:13.5px;color:var(--muted)}

/* ============ PROJECTS PAGE ============ */
.case{display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(24px,4vw,56px);align-items:center;
  padding:clamp(40px,6vh,64px) 0;border-top:1px solid var(--line)}
.case:last-of-type{border-bottom:1px solid var(--line)}
.case:nth-of-type(even) .case-media{order:-1}
@media (max-width:860px){
  .case{grid-template-columns:1fr}
  .case:nth-of-type(even) .case-media{order:0}
}
.case .meta{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.case .meta .no{font-family:var(--fm);font-size:12px;letter-spacing:.12em;color:var(--syn)}
.case .meta .st{font-family:var(--fm);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line2);border-radius:3px;padding:3px 8px}
.case h2{font-size:clamp(30px,4.4vw,52px);font-weight:600;letter-spacing:-.02em;line-height:1.02;margin-bottom:10px}
.case .tg{font-family:var(--fd);font-size:16px;font-weight:500;color:var(--teal);margin-bottom:16px}
.case .ds{font-size:15px;color:var(--muted);max-width:560px}
.case .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.case .tags span{font-family:var(--fm);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px}

.mailrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:34px 0 10px}
.mailrow .addr{font-family:var(--fm);font-size:clamp(16px,2.6vw,26px);color:var(--ink);

.mailrow .addr:hover{border-color:var(--syn)}
.copybtn{width:44px;height:44px;border:1px solid var(--line2);border-radius:11px;display:inline-flex;
  align-items:center;justify-content:center;color:var(--muted);transition:all .15s;flex-shrink:0}
.copybtn:hover{color:var(--ink);border-color:var(--dim)}
.copybtn svg{width:17px;height:17px}
.reasons{margin-top:56px;border-bottom:1px solid var(--line)}
.reason{display:grid;grid-template-columns:90px 1.1fr 1.5fr;gap:26px;align-items:baseline;
  padding:24px 4px;border-top:1px solid var(--line)}
.reason .no{font-family:var(--fm);font-size:12px;color:var(--dim)}
.reason h3{font-size:18px;font-weight:600}
.reason p{font-size:14px;color:var(--muted)}
.reason p a{color:var(--ink);border-bottom:1px solid var(--line2)}
@media (max-width:820px){
  .reason{grid-template-columns:52px 1fr;gap:6px 16px}
  .reason p{grid-column:2}
}

/* ============ CTA BAND ============ */
.band{background:linear-gradient(118deg,var(--deep) 0%,var(--green) 62%,#0A6F62 100%);

  border:1px solid rgba(206,220,0,.18)}
.band::after{content:'';position:absolute;right:-90px;top:-90px;width:330px;height:330px;border-radius:50%;

.band .eyebrow{color:rgba(245,245,247,.6)}
.band h2{font-size:clamp(28px,4.6vw,50px);font-weight:600;line-height:1.05;max-width:620px;margin:14px 0 14px}
.band p{color:rgba(245,245,247,.78);max-width:540px;margin-bottom:30px;font-size:15px}
.band .btn.solid{background:var(--ink)}

/* ============ FOOTER ============ */
footer{border-top:1px solid var(--line);margin-top:clamp(90px,12vh,150px)}
.ft-in{max-width:var(--max);margin:0 auto;padding:56px 26px 30px}
.ft-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:34px;padding-bottom:44px}

.ft-grid img{height:19px;filter:brightness(0) invert(.92);margin-bottom:16px}
.ft-grid .logotype{display:block;margin-bottom:16px}
.ft-grid .desc{font-size:13px;color:var(--muted);max-width:360px;line-height:1.7}
.ft-grid h4{font-family:var(--fm);font-size:10.5px;font-weight:500;letter-spacing:.2em;

.ft-grid ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.ft-grid ul a{font-size:13.5px;color:var(--muted);transition:color .15s}
.ft-grid ul a:hover{color:var(--ink)}
.ft-base{border-top:1px solid var(--line);padding-top:24px;display:flex;justify-content:space-between;
  gap:12px;flex-wrap:wrap;font-family:var(--fm);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim)}

/* ============ MISC ============ */
.go svg{width:12px;height:12px}
.tick svg,.ar svg{width:100%;height:100%}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;display:flex;

.toast{background:#151B19;border:1px solid var(--line2);color:var(--ink);border-radius:12px;

.ic{width:20px;height:20px;flex-shrink:0}

const sb = window.supabase ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;
const $ = s => document.querySelector(s);
const esc = v => v == null ? '' : String(v).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LANGS = ['en','pt','fr'];
function pickLang(){
  const q = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(q)) return q;
  try{ const s = localStorage.getItem('nd-lang'); if (LANGS.includes(s)) return s; }catch(_){}
  const nav = (navigator.language || 'en').slice(0,2).toLowerCase();
  return LANGS.includes(nav) ? nav : 'en';
}
const state = { lang: pickLang(), projects: FALLBACK_PROJECTS, loaded:false };
const T = () => L[state.lang];

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  $('#toast').appendChild(t); setTimeout(()=>t.remove(), 4200); }

function ph(fig, name, cls=''){
  return `<div class="ph ${cls}" role="img" aria-label="${esc(name)}">
    <span class="crop tl"></span><span class="crop tr"></span><span class="crop bl"></span><span class="crop br"></span>

}

/* project text in the active language, English as fallback */
function pt_(p, field){
  const suf = state.lang === 'en' ? '' : '_' + state.lang;
  return p[field + suf] || p[field] || '';
}
const trStatus = s => (T().status && T().status[s]) || s || '';
const trTag    = t => (T().tags   && T().tags[t])   || t || '';
const statusChip = s => `<span class="st">${esc(trStatus(s))}</span>`;

/* ---------------- data ---------------- */
async function loadProjects(){
  if (state.loaded || !sb) return;
  try{
    const { data, error } = await sb.rpc('site_projetos_publico');
    if (!error && Array.isArray(data) && data.length){
      state.projects = data;
      state.loaded = true;
      render(route());
    }
  }catch(_){ /* fallback content stays */ }
}

function chanCard(c){
  const [lb, vl, p, go, kind] = c;
  const href = kind === 'mail' ? `mailto:${CONTACT_EMAIL}`
             : kind === 'sel'  ? 'https://selecao.neurodynamics.dev' : null;
  const attrs = kind === 'sel' ? ' target="_blank" rel="noopener"' : '';
  const inner = `<span class="lb">${esc(lb)}</span>
    <span class="vl">${esc(vl)}</span>
    <p>${esc(p)}</p>
    ${go ? `<span class="go">${esc(go)} ${IC.ne}</span>` : ''}`;
  return href ? `<a class="chan reveal" href="${href}"${attrs}>${inner}</a>`
              : `<div class="chan reveal">${inner}</div>`;
}

function pageProjects(){
  const t = T().projects;
  const n = String(state.projects.length).padStart(2,'0');
  const rows = state.projects.map((p,i)=>{
    const tagline = pt_(p,'tagline'), texto = pt_(p,'descricao') || pt_(p,'resumo');
    return `
  <article class="case reveal">
    <div>
      <div class="meta">
        <span class="no">${String(i+1).padStart(2,'0')} / ${n}</span>
        ${statusChip(p.status)}
      </div>
      <h2>${esc(p.nome)}</h2>
      ${tagline ? `<p class="tg">${esc(tagline)}</p>` : ''}
      <p class="ds">${esc(texto)}</p>
      ${Array.isArray(p.tags) && p.tags.length
        ? `<div class="tags">${p.tags.map(x=>`<span>${esc(trTag(x))}</span>`).join('')}</div>` : ''}
    </div>
    <div class="case-media">
      ${p.imagem_url
        ? `<div class="ph tall"><img class="real" src="${esc(p.imagem_url)}" alt="${esc(p.nome)}"></div>`
        : ph(String(i+1).padStart(2,'0'), p.nome, 'tall')}

  }).join('');

  return `
  <div class="pg-head">
    <span class="eyebrow">${t.eyebrow}</span>

function copyMail(){
  navigator.clipboard?.writeText(CONTACT_EMAIL)
    .then(()=>toast(T().ui.copied))
    .catch(()=>toast(CONTACT_EMAIL));

/* ---------------- router ---------------- */
const PAGES = { home:pageHome, about:pageAbout, projects:pageProjects, contact:pageContact };
function route(){
  const h = (location.hash || '#/').replace(/^#\//,'').split('/')[0];
  return PAGES[h] ? h : 'home';
}
function render(r){
  const t = T();
  document.documentElement.lang = t.htmlLang;
  document.title = t.titles[r];
  $('#meta-desc').setAttribute('content', t.desc);
  $('#main').innerHTML = PAGES[r]();
  document.querySelectorAll('[data-r]').forEach(a => a.classList.toggle('on', a.dataset.r === r));
  closeMenu();
  observe();
}

/* labels that live outside <main> */
function paintChrome(){
  const t = T();
  document.querySelectorAll('#nav-inline [data-k]').forEach(a => a.textContent = t.nav[a.dataset.k]);
  document.querySelectorAll('#nav-menu [data-k]').forEach(a => a.querySelector('.lb').textContent = t.nav[a.dataset.k]);
  document.querySelectorAll('.ft-grid [data-k]').forEach(a => a.textContent = t.nav[a.dataset.k]);
  $('#hd-cta').textContent = t.cta;
  $('#menu-place').textContent = t.menu.place;
  $('#menu-city').textContent = t.menu.city;
  $('#ft-desc').textContent = t.ft.desc;
  $('#ft-h-nav').textContent = t.ft.nav;
  $('#ft-h-reach').textContent = t.ft.reach;
  $('#ft-join').textContent = t.ft.join;
  $('#ft-rights').textContent = t.ft.rights.replace('{y}', new Date().getFullYear());
  $('#lang').innerHTML = LANGS.map(l =>
    `<button data-l="${l}" class="${l===state.lang?'on':''}" aria-pressed="${l===state.lang}"
      lang="${L[l].htmlLang}">${L[l].label}</button>`).join('');
  $('#lang').querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => setLang(b.dataset.l)));
}

function setLang(l){
  if (!LANGS.includes(l) || l === state.lang) return;
  state.lang = l;
  try{ localStorage.setItem('nd-lang', l); }catch(_){}
  paintChrome();
  render(route());
}

window.addEventListener('hashchange', ()=>{ render(route()); window.scrollTo({top:0,behavior:'instant'}); });

/* ---------------- menu ---------------- */
function closeMenu(){ document.body.classList.remove('menu-open');
  $('#burger').setAttribute('aria-expanded','false'); $('#menu').setAttribute('aria-hidden','true'); }
$('#burger').addEventListener('click', ()=>{
  const open = document.body.classList.toggle('menu-open');
  $('#burger').setAttribute('aria-expanded', open);
  $('#menu').setAttribute('aria-hidden', !open);
});
document.addEventListener('keydown', e=>{ if (e.key === 'Escape') closeMenu(); });

/* ---------------- scroll effects ---------------- */
let obs;
function observe(){
  obs?.disconnect();
  obs = new IntersectionObserver(es => es.forEach(e=>{
    if (e.isIntersecting){ e.target.classList.add('viu'); obs.unobserve(e.target); }
  }), { threshold:.12 });
  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
}
window.addEventListener('scroll', ()=>{
  $('#hd').classList.toggle('rolou', window.scrollY > 8);
}, { passive:true });

/* ---------------- boot ---------------- */
['#logo-hd','#logo-ft'].forEach(sel=>{
  const img = $(sel);
  img.onerror = () => { const s=document.createElement('span'); s.className='logotype';
    s.textContent='NeuroDynamics'; img.replaceWith(s); };
  img.src = LOGO_URL;
});
$('#ft-mail').href = `mailto:${CONTACT_EMAIL}`; $('#ft-mail').textContent = CONTACT_EMAIL;
$('#menu-mail').href = `mailto:${CONTACT_EMAIL}`; $('#menu-mail').textContent = CONTACT_EMAIL;
paintChrome();
render(route());
loadProjects();
</script>
